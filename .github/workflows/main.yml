# Deploy VSX Extension
# Based on: https://github.com/HaaLeo/publish-vscode-extension
name: Build and Deploy Extension


on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Version bump type'
        required: true
        default: 'patch'
        options:
          - patch
          - minor

env:
  NODE_VERSION: '20.x'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bump version in package.json
        id: bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          npm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          git add package.json package-lock.json || true
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]" || echo "No changes to commit."
          git push

      - name: Create tag (triggers release workflow)
        id: createTag
        run: |
          git tag v${{ steps.bump.outputs.new_version }}
          git push origin v${{ steps.bump.outputs.new_version }}


  build:
    runs-on: ubuntu-latest
    needs: bump-version
    outputs:
      vsixName: ${{ steps.packageExtension.outputs.vsixPath }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Package extension .vsix
        id: packageExtension
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: stub
          dryRun: true
          dependencies: false

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-imagej-vsix
          path: ${{ steps.packageExtension.outputs.vsixPath }}

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4.1.7
        with:
          name: vscode-imgagej-vsix

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.vsixName }}

      # Pulbish to Open VSX Registry
      # - name: Publish to Open VSX Registry
      #   uses: HaaLeo/publish-vscode-extension@v1
      #   id: publishToOpenVSX
      #   with:
      #     pat: ${{ secrets.OPEN_VSX_TOKEN }}
      #     extensionFile: ${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.vsixName }}
      #     registryUrl: https://open-vsx.org

      # Publish to VS Marketplace
      # - name: Publish to Visual Studio Marketplace
      #   uses: HaaLeo/publish-vscode-extension@v1
      #   with:
      #     pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
      #     extensionFile: ${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.vsixName }}
      #     registryUrl: https://marketplace.visualstudio.com
